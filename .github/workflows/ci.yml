name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev bubblewrap
          # The keyring-only session bus tests run xdg-dbus-proxy against a
          # private dbus-daemon, with a Python GObject name owner and gdbus.
          sudo apt-get install -y xdg-dbus-proxy dbus dbus-session-bus-common python3-gi libglib2.0-bin

      # Ubuntu lets only AppArmor-profiled programs create unprivileged user
      # namespaces, which bwrap needs; the sandbox tests below require it.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Check generated bindings
        run: |
          npm run gen:bindings
          git diff --exit-code src/generated/bindings.ts

      - name: Build frontend
        run: npm run build

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust clippy
        working-directory: src-tauri
        # --all-targets brings tests, benches and examples under the lint
        # policy; a plain `cargo clippy` lints only the lib, the bin and
        # build.rs. README already tells contributors to run it this way.
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      # Socket confinement needs Landlock ABI 9 and abstract-socket scoping
      # ABI 6; the tests check what this kernel offers and skip the rest.
      # Set CLAI_REQUIRE_LANDLOCK_ABI on a runner whose kernel is known to
      # have an ABI, so those skips fail instead.
      - name: Landlock ABI
        run: python3 -c "import ctypes; print(\"Landlock ABI\", ctypes.CDLL(None).syscall(444, None, 0, 1))"

      - name: Rust tests
        working-directory: src-tauri
        # The tests that run real bwrap, or the session bus proxy, skip where
        # they cannot run; here a skip fails the job instead.
        env:
          CLAI_REQUIRE_BWRAP: 1
          CLAI_REQUIRE_BUS_PROXY: 1
        run: cargo test

      - name: Build Tauri app (debug, no bundle)
        run: npm run tauri -- build --debug --no-bundle

  windows-check:
    name: Windows check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      # generate_context! (src-tauri/src/lib.rs) embeds frontendDist (../dist)
      # into the binary at compile time, so the Rust steps below need dist/ to
      # exist. Build the frontend first (mirrors the Linux job's ordering). The
      # frontend quality checks (lint/typecheck/tests/bindings) and fmt are
      # platform-independent and already covered by the Linux `check` job, so we
      # don't repeat them here — this job exists to compile-check the
      # Windows-only (`#[cfg(windows)]` / `cfg!(windows)`) Rust paths.
      - name: Build frontend
        run: npm run build

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust clippy
        working-directory: src-tauri
        # --all-targets brings tests, benches and examples under the lint
        # policy; a plain `cargo clippy` lints only the lib, the bin and
        # build.rs. README already tells contributors to run it this way.
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
