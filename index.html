<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Desktop multi-agent orchestration app with MCP-native tools" />
    <meta name="theme-color" content="#00AB44" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <title>CLAI</title>
  </head>

  <body>
    <!-- Splash Screen - Shows immediately before React loads -->
    <div id="splash-screen" style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0A0E14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    ">
      <!-- CLAI Icon (must stay inline: the splash paints before any asset request) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="5.3 0.8 89.4 89.4" role="img" aria-labelledby="splash-clai-mark-title" style="width: 80px; height: 80px; margin-bottom: 24px;">
        <title id="splash-clai-mark-title">CLAI</title>
        <defs>
          <clipPath id="splash-clai-head">
            <path d="M50 22 C76.1 22 82 27.9 82 54 C82 80.1 76.1 86 50 86 C23.9 86 18 80.1 18 54 C18 27.9 23.9 22 50 22Z"/>
          </clipPath>
        </defs>
        <path d="M47.8 24 L44.8 10" fill="none" stroke="#6d77cd" stroke-width="4" stroke-linecap="round"/>
        <circle cx="44.8" cy="8" r="4" fill="#6d77cd"/>
        <path d="M50 22 C76.1 22 82 27.9 82 54 C82 80.1 76.1 86 50 86 C23.9 86 18 80.1 18 54 C18 27.9 23.9 22 50 22Z" fill="#6d77cd"/>
        <g clip-path="url(#splash-clai-head)">
          <ellipse cx="50" cy="76" rx="30.6" ry="10" fill="#484d9f" opacity="0.45"/>
        </g>
        <rect x="33.9" y="44.4" width="32.2" height="5.8" rx="2.9" fill="#0d0f23"/>
        <path d="M43 65.1 Q50 73.5 57 65.1" fill="none" stroke="#0d0f23" stroke-width="3.1" stroke-linecap="round"/>
        <g clip-path="url(#splash-clai-head)">
          <rect x="5" y="44.4" width="90" height="5.8" rx="0" fill="#0d0f23"/>
        </g>
      </svg>

      <!-- Spinner -->
      <div style="
        width: 32px;
        height: 32px;
        border: 3px solid rgba(109, 119, 205, 0.2);
        border-top-color: #6d77cd;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      "></div>

      <style>
        @keyframes splash-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>

    <script>
      // Global function to hide splash screen
      window.hideSplashScreen = function() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() {
            splash.remove();
          }, 300);
        }
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
